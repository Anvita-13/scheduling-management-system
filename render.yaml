# Render Blueprint: PostgreSQL + FastAPI backend (Docker) + React frontend (static site).
# Full walkthrough, free-tier limits and the two values you must fill in: DEPLOY.md
#
# The three names below decide your public URLs (https://<name>.onrender.com) IF they are not already taken
# on Render. Change them to something unique (e.g. add your initials) before you create the Blueprint.

databases:
  - name: anvita-arun-scheduling-db
    plan: free                  # Render free Postgres EXPIRES 30 days after creation (+14 days grace) — see DEPLOY.md
    databaseName: scheduling
    user: scheduling
    region: oregon              # keep the same region as the backend: the private connection string needs it

services:
  # ---------------------------------------------------------------- backend (FastAPI in Docker)
  - type: web
    name: anvita-arun-scheduling-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free                  # sleeps after 15 min without traffic; the next request takes ~1 min to wake it
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: anvita-arun-scheduling-db
          property: connectionString
      - key: SECRET_KEY         # signs login tokens — generated by Render, never committed
        generateValue: true
      - key: SEED_ADMIN_PASSWORD # random admin password; read it in this service's Environment tab
        generateValue: true
      - key: CORS_ORIGINS       # you are prompted for this: the frontend's public URL, e.g. https://scheduling-frontend.onrender.com
        sync: false
      - key: PORT               # the backend image listens on 8000
        value: "8000"
      - key: SEED_ON_START      # load the sample dataset on first start (skips itself once data exists)
        value: "true"
      - key: RESET_ON_START     # NEVER "true" here: it would wipe the database on every restart/wake-up
        value: "false"

  # ---------------------------------------------------------------- frontend (static site)
  - type: web
    name: anvita-arun-scheduling-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL       # you are prompted for this: the backend's public URL + /api, e.g. https://scheduling-backend.onrender.com/api
        sync: false
      - key: NODE_VERSION
        value: "20"
    routes:
      - type: rewrite           # single-page app: every path is served by index.html (React Router handles it)
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

# Serves the built React app and proxies /api to the backend container, so the browser only ever talks
# to one origin (this one) — no CORS configuration is needed for the app to work.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # FastAPI's own routes are already mounted under /api (see backend/app/main.py), so the prefix is
    # preserved as-is: a browser request for /api/auth/login reaches the backend at the same path.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Client-side routing (React Router): any path that isn't a real static file falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
